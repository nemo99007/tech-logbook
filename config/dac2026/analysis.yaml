20260729_120436.jpg:
  is_technical: true
  title: 'Zero-glitch confidence: static, formal and simulation'
  presenter_or_company: Meta / Synopsys
  is_my_poster: false
  summary: Combined static CDC, formal CDC glitch checking and VCS simulation flow, applied to async FIFOs,
    mux structures, FSMs and memory DS/LS pins.
  perspective: A layered flow is realistic; since gate-level behavior matters for glitches, the interesting
    question is where emulation could fill the remaining gap.
  tags:
  - cdc
  - formal
  - verification
  summary_ko: static CDC, formal CDC glitch 검사, VCS 시뮬레이션을 결합한 플로우입니다. 비동기 FIFO, mux 구조, FSM, 메모리 DS/LS
    핀에 적용했습니다.
  perspective_ko: 계층형 플로우는 현실적입니다. glitch에는 게이트 레벨 동작이 중요하므로, 남는 공백을 에뮬레이션이 어디서 채울 수 있는지가 흥미로운 질문입니다.
