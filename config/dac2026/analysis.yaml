20260728_110354.jpg:
  is_technical: true
  title: AI-Assisted EDA Tools Development
  presenter_or_company: IBM Austin
  is_my_poster: false
  summary: 'MCP building blocks (parsing, analysis, construction on an HDL parser)
    plus an agentic framework (Intent Parser, Tool Synthesizer, Mediator, Executor/Validator)
    that generate EDA tools from natural language. Evidence: new DFT structural checks
    produced in under 30 minutes, 1110 injected LOC (~90% reusable blocks), ~4 person-weeks
    of manual effort saved.'
  perspective: Generated checks are only as good as the validation against known designs;
    the poster reports correctness against target designs but not false-positive rates.
    Interesting for in-house lint/rule-check scripting.
  tags:
  - llm
  - agentic-ai
  - dft
