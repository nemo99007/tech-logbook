20260727_155157.jpg:
  is_technical: true
  title: Firmware-driven random verification on emulation
  presenter_or_company: Samsung (image sensor / ISP)
  is_my_poster: false
  summary: UVM sequences generate randomized sensor usage intents (mode, resolution,
    exposure, orientation). Firmware on the emulated DUT executes realistic configuration
    sequences, and hardware outputs are observed and compared with a reference C-model
    through DPI-C. UVM acceleration on the emulator makes long-running runs feasible.
  perspective: 'This is the closest talk to everyday emulation work: UVM-acceleration
    with real firmware. The things to check are testbench-to-DUT transaction overhead
    in acceleration mode and how failures that need long-running state are debugged
    with limited signal visibility.'
  tags:
  - emulation
  - uvm
  - firmware
20260727_162722.jpg:
  is_technical: true
  title: Fastboot virtualization and on-prem LLM failure analysis (Main Idea slide)
  presenter_or_company: Samsung Electronics
  is_my_poster: false
  summary: 'Main Idea slide: a software test platform drives a hybrid emulation environment
    through a virtualized Fastboot interface, and an on-premises LLM (RAG) classifies
    kernel logs as real software bugs or non-critical events.'
  perspective: Virtualizing Fastboot removes the need for a physical USB link in emulation.
    Keeping the LLM on-premises matters for confidentiality of logs; the cost is how
    much emulation time the automated reboot/flash loop consumes.
  tags:
  - emulation
  - virtualization
  - llm
