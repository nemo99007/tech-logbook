20260727_114025.jpg:
  is_technical: true
  title: Voltage-droop mitigation on MAIA 200
  presenter_or_company: Microsoft
  is_my_poster: false
  summary: Poster on voltage-droop mitigation for MAIA 200 with Pre-Si / Post-Si correlation and Verilog-A
    models.
  perspective: 'Pre-Si/Post-Si correlation is the useful part: it shows how far pre-silicon power/droop
    analysis can be trusted against measured silicon.'
  tags:
  - power
  - post-silicon
  summary_ko: MAIA 200의 전압 강하(voltage droop) 완화에 관한 포스터입니다. Pre-Si/Post-Si 상관 분석과 Verilog-A 모델을 다룹니다.
  perspective_ko: Pre-Si/Post-Si 상관이 핵심입니다. 실리콘 이전의 전력/droop 분석을 실측 실리콘과 비교해 어디까지 믿을 수 있는지 보여줍니다.
20260727_154434.jpg:
  is_technical: true
  title: 'Evidence: Imsys IM3000 microcode CPU'
  presenter_or_company: Stefan Blixt, Telesis Innovation
  is_my_poster: false
  summary: 'Evidence slide for the soft-microcode engine talk: IM3000 versus MSP430 on TI benchmarks (energy,
    execution time, code size), code size compared with x86, and customer statements (Sony, MUNIC CAR
    DATA).'
  perspective: The slide is mostly customer testimonials; for emulation use, a rewritable-microcode CPU
    raises the question of how its state would be observed and debugged.
  tags:
  - cpu-architecture
  summary_ko: 소프트 마이크로코드 엔진 발표의 근거 슬라이드입니다. TI 벤치마크에서 IM3000과 MSP430을 비교(에너지, 실행 시간, 코드 크기)하고, x86과 코드
    크기를 비교하며, 고객 발언(Sony, MUNIC CAR DATA)을 싣고 있습니다.
  perspective_ko: 슬라이드 대부분이 고객 증언입니다. 에뮬레이션 관점에서는 마이크로코드를 다시 쓸 수 있는 CPU의 상태를 어떻게 관측하고 디버그할지가 의문입니다.
20260727_155157.jpg:
  is_technical: true
  title: Firmware-driven random verification on emulation
  presenter_or_company: Samsung (image sensor / ISP)
  is_my_poster: false
  summary: UVM sequences generate randomized sensor usage intents (mode, resolution, exposure, orientation).
    Firmware on the emulated DUT executes realistic configuration sequences, and hardware outputs are
    observed and compared with a reference C-model through DPI-C. UVM acceleration on the emulator makes
    long-running runs feasible.
  perspective: 'This is the closest talk to everyday emulation work: UVM-acceleration with real firmware.
    The things to check are testbench-to-DUT transaction overhead in acceleration mode and how failures
    that need long-running state are debugged with limited signal visibility.'
  tags:
  - emulation
  - uvm
  - firmware
  summary_ko: UVM 시퀀스가 센서 사용 의도(모드, 해상도, 노출, 방향)를 무작위로 생성합니다. 에뮬레이션된 DUT 위의 펌웨어가 실제와 같은 설정 시퀀스를 실행하고,
    하드웨어 출력은 DPI-C를 통해 reference C-model과 비교됩니다. 에뮬레이터의 UVM acceleration으로 긴 실행이 가능해집니다.
  perspective_ko: 일상적인 에뮬레이션 업무에 가장 가까운 발표입니다. 실제 펌웨어를 쓰는 UVM acceleration이라서, acceleration 모드에서 테스트벤치와
    DUT 사이의 트랜잭션 오버헤드와, 긴 상태가 필요한 실패를 제한된 신호 가시성으로 어떻게 디버그하는지를 확인해 볼 만합니다.
20260727_162722.jpg:
  is_technical: true
  title: Fastboot virtualization and on-prem LLM failure analysis (Main Idea slide)
  presenter_or_company: Samsung Electronics
  is_my_poster: false
  summary: 'Main Idea slide: a software test platform drives a hybrid emulation environment through a
    virtualized Fastboot interface, and an on-premises LLM (RAG) classifies kernel logs as real software
    bugs or non-critical events.'
  perspective: Virtualizing Fastboot removes the need for a physical USB link in emulation. Keeping the
    LLM on-premises matters for confidentiality of logs; the cost is how much emulation time the automated
    reboot/flash loop consumes.
  tags:
  - emulation
  - virtualization
  - llm
  summary_ko: Main Idea 슬라이드입니다. 소프트웨어 테스트 플랫폼이 가상화된 Fastboot 인터페이스로 하이브리드 에뮬레이션 환경을 구동하고, 온프레미스 LLM(RAG)이
    커널 로그를 실제 소프트웨어 버그와 중요하지 않은 이벤트로 분류합니다.
  perspective_ko: Fastboot를 가상화하면 에뮬레이션에서 물리 USB 연결이 필요 없어집니다. LLM을 온프레미스에 두는 것은 로그 기밀 때문에 중요하고, 대가로 자동
    reboot/flash 루프가 에뮬레이션 시간을 얼마나 쓰는지가 관건입니다.
20260728_100544.jpg:
  is_technical: true
  title: Multi-cycle dynamic vectorless analysis for PDN signoff
  presenter_or_company: Qualcomm / Cadence
  is_my_poster: false
  summary: Poster on multi-cycle dynamic vectorless analysis for improving power-delivery-network signoff.
  perspective: Vectorless analysis is an alternative to waiting for realistic emulation vectors; it is
    worth comparing which cases still need real activity from emulation.
  tags:
  - power
  - signoff
  summary_ko: PDN(전원 공급 네트워크) 사인오프를 개선하기 위한 multi-cycle dynamic vectorless 분석 포스터입니다.
  perspective_ko: Vectorless 분석은 현실적인 에뮬레이션 벡터를 기다리는 것의 대안입니다. 어떤 경우에 에뮬레이션의 실제 활동 데이터가 여전히 필요한지 비교해 볼
    만합니다.
20260728_110354.jpg:
  is_technical: true
  title: AI-Assisted EDA Tools Development
  presenter_or_company: IBM Austin
  is_my_poster: false
  summary: 'MCP building blocks (parsing, analysis, construction on an HDL parser) plus an agentic framework
    (Intent Parser, Tool Synthesizer, Mediator, Executor/Validator) that generate EDA tools from natural
    language. Evidence: new DFT structural checks produced in under 30 minutes, 1110 injected LOC (~90%
    reusable blocks), ~4 person-weeks of manual effort saved.'
  perspective: Generated checks are only as good as the validation against known designs; the poster reports
    correctness against target designs but not false-positive rates. Interesting for in-house lint/rule-check
    scripting.
  tags:
  - llm
  - agentic-ai
  - dft
  summary_ko: HDL 파서 위의 MCP 구성 요소(파싱, 분석, 생성)와 에이전트 프레임워크(Intent Parser, Tool Synthesizer, Mediator, Executor/Validator)로
    자연어에서 EDA 툴을 만듭니다. 근거로 새 DFT 구조 검사를 30분 이내에 생성했고, 주입된 코드는 1110줄(약 90%는 재사용 블록)이며, 수작업 약 4 person-week를
    줄였다고 합니다.
  perspective_ko: 생성된 검사는 알려진 설계로 한 검증만큼만 믿을 수 있습니다. 포스터는 대상 설계에 대한 정확성은 보고하지만 false-positive 비율은 보고하지
    않습니다. 사내 lint/룰 체크 스크립팅에 참고할 만합니다.
20260728_134119.jpg:
  is_technical: true
  title: Design-aware test points in SystemRDL-to-RTL generators
  presenter_or_company: Google / Agnisys
  is_my_poster: false
  summary: 'Engineering Track paper 64: DFT intelligence through design-aware test points inserted by
    SystemRDL-to-RTL generators; reported ~40% pattern reduction.'
  perspective: Moving DFT decisions into the RTL generator shifts work left; the downstream effect on
    gate-level verification and emulation runtime is what to look for.
  tags:
  - dft
  - rtl-generation
  summary_ko: Engineering Track 논문 64입니다. SystemRDL-to-RTL 생성기가 넣는 design-aware test point로 DFT 지능을 높이는
    방법을 다루며, 패턴이 약 40% 줄었다고 보고했습니다.
  perspective_ko: DFT 판단을 RTL 생성기로 옮기면 작업이 앞당겨집니다. 게이트 레벨 검증과 에뮬레이션 런타임에 주는 후속 영향을 봐야 합니다.
20260728_134139.jpg:
  is_technical: true
  title: VT-skew MC analysis and load-splitting IR-ECO
  presenter_or_company: TSMC (+ Synopsys)
  is_my_poster: false
  summary: 'Two TSMC posters: a Monte-Carlo feature with an analytical metric for VT-skew impact (CPU
    time 1.4x/2.7x vs regular STA on 10k/100k paths) and slack-exploiting load splitting for IR-drop mitigation
    (17.0% additional max dynamic IR-drop reduction, 20.2% fewer violations).'
  perspective: Back-end topics; included for context on how signoff-side methods are being tuned.
  tags:
  - signoff
  - power
  summary_ko: TSMC 포스터 두 편입니다. VT-skew 영향을 분석적 지표로 다루는 Monte-Carlo 기능(경로 1만/10만 개에서 일반 STA 대비 CPU 시간 1.4배/2.7배)과,
    IR-drop 완화를 위한 slack 활용 load splitting(최대 동적 IR-drop 17.0% 추가 감소, 위반 20.2% 감소)입니다.
  perspective_ko: 백엔드 주제로, 사인오프 쪽 기법이 어떻게 다듬어지고 있는지 맥락을 위해 포함했습니다.
20260728_134255.jpg:
  is_technical: true
  title: 'RDC methodology: noise reduction and accuracy'
  presenter_or_company: Google
  is_my_poster: false
  summary: 'Reset-domain-crossing methodology: soft-reset handling reduced reported items (707 to 403,
    13 to 5, 567 to 67 in the cases shown).'
  perspective: Large RDC noise reduction is a good sign for sign-off flows; the open point is how much
    is waived by methodology versus truly resolved.
  tags:
  - rdc
  - verification
  summary_ko: Reset-domain-crossing 방법론입니다. soft-reset 처리로 보고 항목이 줄었습니다(소개된 사례에서 707→403, 13→5, 567→67).
  perspective_ko: RDC 노이즈가 크게 줄었다는 점은 사인오프 플로우에 좋은 신호입니다. 다만 방법론으로 waive된 것과 실제로 해결된 것의 비율이 열린 질문입니다.
20260728_134334.jpg:
  is_technical: true
  title: DFT verification with Veloce full-chip gate-level emulation
  presenter_or_company: Samsung / Siemens
  is_my_poster: false
  summary: 'Veloce-based full-chip gate-level emulation for DFT verification: roughly x513 faster shift
    and x322 faster capture than simulation, with a Debug STIL flow for debuggability.'
  perspective: Highly relevant. Gate-level emulation speedups are easy to quote; the real cost is netlist
    compile time and debug visibility, which this poster addresses with Debug STIL.
  tags:
  - emulation
  - dft
  - debug
  summary_ko: Veloce 기반 풀칩 게이트 레벨 에뮬레이션으로 DFT를 검증합니다. 시뮬레이션 대비 shift는 약 513배, capture는 약 322배 빠르고, 디버깅을
    위한 Debug STIL 플로우가 있습니다.
  perspective_ko: 매우 관련이 큽니다. 게이트 레벨 에뮬레이션의 속도 향상은 수치로 말하기 쉽지만 실제 비용은 넷리스트 컴파일 시간과 디버그 가시성이며, 이 포스터는 Debug
    STIL로 이를 다룹니다.
