20260727_165840.jpg:
  is_technical: true
  title: 'My poster: Hybrid Virtual ICE — Pre-Silicon Real Workloads Validation'
  presenter_or_company: Anritsu / Samsung / Synopsys (ZeBu)
  is_my_poster: true
  summary: 'Our Engineering Track poster (right; the Samsung Fastboot poster is on
    the left). A hybrid virtual ICE: instead of a physical target cable, speed adapter
    and real tester hardware, a wireless network tester (Anritsu) is connected to
    the ZeBu-emulated modem SoC through a virtualized packet-based IQ interface, so
    real network workloads run against cycle-accurate RTL before silicon.'
  perspective: Traditional ICE ties emulation to physical cables and speed adapters,
    which causes frequency mismatch, hard-to-reproduce runs and no remote access,
    while a pure virtual platform is not cycle accurate. Hybrid virtual ICE keeps
    the RTL in the emulator and virtualizes the outside world. We frame it as an industry
    interoperability challenge between tools and emulators, not a one-off internal
    fix.
  tags:
  - emulation
  - virtualization
  - virtual-ice
  - my-work
