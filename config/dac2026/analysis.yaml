20260729_154134.jpg:
  is_technical: true
  title: AI-powered batch flow for memory cache verification
  presenter_or_company: Qualcomm / Siemens (Solido)
  is_my_poster: false
  summary: 'Solido worst-case yield solver: adaptive AI predicts yield, reinforcement learning drives
    high-sigma verification; 726 netlists, 3.25x runtime speedup per job and 2.4x simulation speedup per
    job against the previous method.'
  perspective: Analog/memory yield rather than digital emulation, but the batch-flow pattern (scripted,
    resumable after IT failures) applies to any long regression.
  tags:
  - ai
  - signoff
  summary_ko: Solido worst-case yield solver입니다. adaptive AI가 수율을 예측하고 강화학습이 high-sigma 검증을 이끕니다. 넷리스트
    726개에서 기존 방식 대비 작업당 런타임 3.25배, 시뮬레이션 2.4배 빨라졌습니다.
  perspective_ko: 디지털 에뮬레이션이 아니라 아날로그/메모리 수율 이야기지만, 스크립트화되고 IT 장애 뒤에도 재개할 수 있는 batch flow 패턴은 긴 regression
    전반에 적용할 수 있습니다.
20260727_165840.jpg:
  is_technical: true
  title: 'My poster: Hybrid Virtual ICE — Pre-Silicon Real Workloads Validation'
  presenter_or_company: Anritsu / Samsung / Synopsys (ZeBu)
  is_my_poster: true
  summary: 'Our Engineering Track poster (right; the Samsung Fastboot poster is on the left). A hybrid
    virtual ICE: instead of a physical target cable, speed adapter and real tester hardware, a wireless
    network tester (Anritsu) is connected to the ZeBu-emulated modem SoC through a virtualized packet-based
    IQ interface, so real network workloads run against cycle-accurate RTL before silicon.'
  perspective: Traditional ICE ties emulation to physical cables and speed adapters, which causes frequency
    mismatch, hard-to-reproduce runs and no remote access, while a pure virtual platform is not cycle
    accurate. Hybrid virtual ICE keeps the RTL in the emulator and virtualizes the outside world. We frame
    it as an industry interoperability challenge between tools and emulators, not a one-off internal fix.
  tags:
  - emulation
  - virtualization
  - virtual-ice
  - my-work
  summary_ko: Engineering Track 포스터(오른쪽, 왼쪽은 삼성 Fastboot 포스터)입니다. 하이브리드 virtual ICE로, 물리 타깃 케이블, 스피드 어댑터,
    실제 테스터 하드웨어 대신 무선망 테스터(Anritsu)를 패킷 기반 IQ 인터페이스로 가상화해 ZeBu로 에뮬레이션한 모뎀 SoC에 연결합니다. 실리콘 이전에 사이클 정확한
    RTL로 실제 네트워크 워크로드를 돌릴 수 있습니다.
  perspective_ko: 기존 ICE는 에뮬레이션을 물리 케이블과 스피드 어댑터에 묶어 두기 때문에 주파수 불일치, 재현이 어려운 실행, 원격 접속 불가 문제가 생기고, 순수
    가상 플랫폼은 사이클 정확하지 않습니다. 하이브리드 virtual ICE는 RTL은 에뮬레이터에 두고 외부 세계만 가상화합니다. 사내 한 번의 해결책이 아니라 툴과 에뮬레이터
    사이의 업계 상호운용성 과제로 보고 있습니다.
