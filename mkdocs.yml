site_name: Tech Logbook
site_description: Front-End Verification & Emulation perspective on the 63rd DAC (Long
  Beach, July 2026)
site_author: Nemo Kyuho SHIM
site_url: https://nemo99007.github.io/tech-logbook/
repo_url: https://github.com/nemo99007/tech-logbook
theme:
  name: material
  custom_dir: overrides
  features:
  - navigation.sections
  - navigation.top
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
extra_css:
- assets/lang.css
extra_javascript:
- assets/lang.js
plugins:
- search
- glightbox
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- attr_list
- md_in_html
nav:
- Home: index.md
- Elastic Seminars in Seoul, October 2026: elastic2026/index.md
- Keysight World Tech Day Seoul 2026: keysight2026/index.md
- Google Cloud × Datadog Agent Seminar: google_datadog2026/index.md
- "Better Together: Snowflake × Dataiku Enterprise AI": dataiku_snowflake2026/index.md
- SNUG Korea 2026 · Synopsys Converge: snug2026/index.md
- CadenceLIVE Korea 2026: cadencelive2026/index.md
- Snowflake World Tour Seoul 2026: snowflake2026/index.md
- Dell Technologies Forum 2026 Seoul: dellforum2026/index.md
- Siemens EDA Forum Seoul 2026: siemens2026/index.md
- DAC 2026: dac2026/index.md
- Google AI for Business 2026: googlecloud2026/index.md
- Papers (yt-paper): https://nemo99007.github.io/yt-paper/
